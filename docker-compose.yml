services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expert_content_studio
      POSTGRES_USER: expert
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - expert-content-studio-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U expert -d expert_content_studio"
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://expert@db:5432/expert_content_studio
      # Compose is an HTTP-only, loopback-local development example. Do not use
      # this setting for an HTTPS deployment.
      AUTH_COOKIE_SECURE: "false"
      # Pass the bootstrap secret from the host or untracked .env file; never
      # hardcode it here. An absent value remains empty so the backend refuses
      # to start an auth-enabled empty database. This is a normal container
      # environment variable, not a Docker secret, and Docker host access can
      # expose it.
      AUTH_INITIAL_ADMIN_PASSWORD: ${AUTH_INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Local development only; place a production deployment behind its own
      # same-origin HTTPS reverse proxy.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Local development only; this Compose file does not configure TLS.
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:5173/"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  expert-content-studio-data:
    name: expert-content-studio-data

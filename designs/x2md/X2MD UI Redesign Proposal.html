<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X² Studio · UI 高级化设计提案</title>
  <link rel="stylesheet" href="redesign.css" />
</head>
<body>
  <main id="root"></main>
  <script>
    window.__errs = [];
    window.addEventListener("error", function (e) {
      window.__errs.push((e.filename || "?").split("/").pop() + ":" + e.lineno + " " + String(e.message).slice(0, 100));
      document.title = "ERR(" + window.__errs.length + "): " + String(e.message).slice(0, 90);
    });
    window.addEventListener("unhandledrejection", function (e) {
      window.__errs.push("REJ " + String((e.reason && e.reason.message) || e.reason).slice(0, 100));
      document.title = "REJ(" + window.__errs.length + ")";
    });
  </script>
  <noscript>此设计稿需要启用 JavaScript。</noscript>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="panels.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>

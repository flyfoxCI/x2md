[project]
name = "expert-content-studio-backend"
version = "0.1.0"
description = "FastAPI service for Expert Content Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

# Use the public PyPI registry rather than a machine-specific default index.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
